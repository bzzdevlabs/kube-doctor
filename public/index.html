<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kube Doctor</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 28 8.8v14.4L16 29.5 4 23.2V8.8z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M16 9.5v13M9.5 16h13" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>
      <span class="brand-name">Kube Doctor</span>
      <span class="ro-badge" title="Only get/list/logs/top calls are ever issued. Nothing in your cluster or kubeconfig is modified.">READ-ONLY</span>
      <span class="demo-badge" id="demo-badge" hidden>DEMO CLUSTER</span>
    </div>
    <div class="controls">
      <label class="ctl">
        <span>Context</span>
        <select id="ctx" aria-label="Kube context"></select>
      </label>
      <label class="ctl">
        <span>Namespace</span>
        <select id="ns" aria-label="Namespace filter"><option value="">All namespaces</option></select>
      </label>
      <label class="ctl check" title="Read the logs of crashing containers during the scan to find the root cause">
        <input type="checkbox" id="logs" checked> <span>Analyze logs</span>
      </label>
      <label class="ctl">
        <span>Auto-refresh</span>
        <select id="auto" aria-label="Auto refresh">
          <option value="0">Off</option>
          <option value="30">30 s</option>
          <option value="60">1 min</option>
          <option value="300">5 min</option>
        </select>
      </label>
      <button id="scan" class="btn primary" type="button">Scan</button>
      <button id="theme" class="btn icon" type="button" title="Toggle light/dark theme" aria-label="Toggle theme"><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><circle cx="12" cy="12" r="8.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/></svg></button>
    </div>
  </header>
  <div class="progress" id="progress" hidden><div></div></div>

  <section class="strip" id="strip"></section>

  <main class="page">
    <section id="summary"></section>
    <nav class="tabs" id="tabs" role="tablist"></nav>
    <section id="view" class="view"></section>
  </main>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" tabindex="-1"></aside>
  <div class="toast" id="toast" hidden></div>
</body>
</html>
